<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yoto App Launcher Transpiler</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-8">
  <div class="max-w-4xl mx-auto space-y-8">
    
    <!-- Header -->
    <header class="flex justify-between items-center border-b border-slate-700 pb-4">
      <h1 class="text-2xl font-bold text-amber-400">Yoto DSL Code Transpiler & Launcher</h1>
      <button id="authBtn" onclick="loginYoto()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold px-4 py-2 rounded-lg">
        Connect Yoto Account
      </button>
    </header>

    <!-- Transpiler & Editor Section -->
    <main class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Script Input -->
      <div class="space-y-3">
        <label class="block font-medium text-slate-300">Simple Launcher Script (DSL):</label>
        <textarea id="dslInput" rows="10" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 font-mono text-sm focus:outline-none focus:border-amber-400" placeholder="// Example Script:
SET DEVICE 'yoto-living-room'
LAUNCH CARD 'card-abc-123' AT TRACK 1"></textarea>
        <button onclick="compileAndRun()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-lg transition">
          Compile & Run Launcher Script
        </button>
      </div>

      <!-- Compiled API Output & Log -->
      <div class="space-y-3">
        <label class="block font-medium text-slate-300">Yoto API Payload Output:</label>
        <pre id="jsonOutput" class="w-full h-60 bg-slate-950 border border-slate-800 rounded-lg p-3 font-mono text-xs text-green-400 overflow-auto">// Compiled JSON payloads will appear here</pre>
        <div id="statusLog" class="text-sm text-slate-400 italic">Status: Ready</div>
      </div>
    </main>
  </div>

  <script>
    let authToken = localStorage.getItem('yoto_token');

    function loginYoto() {
      const clientId = 'YOUR_YOTO_CLIENT_ID';
      const redirectUri = encodeURIComponent('http://localhost:3000/api/auth/callback');
      const scope = encodeURIComponent('family:devices:control family:library:view');
      window.location.href = `https://api.yotoplay.com/oauth/authorize?response_type=code&client_id=${clientId}&redirect_uri=${redirectUri}&scope=${scope}`;
    }

    // Simple Transpiler Engine: Converts simplified script lines to Yoto API Commands
    function parseSimpleCode(codeText) {
      const lines = codeText.split('\n');
      let targetDevice = null;
      const commands = [];

      lines.forEach((line, index) => {
        const trimmed = line.trim();
        if (!trimmed || trimmed.startsWith('//')) return;

        // Parse: SET DEVICE 'deviceId'
        const deviceMatch = trimmed.match(/^SET DEVICE ['"]([^'"]+)['"]/i);
        if (deviceMatch) {
          targetDevice = deviceMatch[1];
          return;
        }

        // Parse: LAUNCH CARD 'cardId' [AT TRACK x]
        const launchMatch = trimmed.match(/^LAUNCH CARD ['"]([^'"]+)['"](?:\s+AT TRACK\s+(\d+))?/i);
        if (launchMatch) {
          const cardId = launchMatch[1];
          const track = launchMatch[2] ? `/${launchMatch[2]}` : '';
          
          if (!targetDevice) {
            throw new Error(`Line ${index + 1}: Target device must be set before LAUNCH command.`);
          }

          commands.push({
            endpoint: `/v1/family/devices/${targetDevice}/play`,
            payload: {
              uri: `yoto://card/${cardId}${track}`
            }
          });
        }
      });

      return commands;
    }

    async function compileAndRun() {
      const code = document.getElementById('dslInput').value;
      const outputElem = document.getElementById('jsonOutput');
      const statusElem = document.getElementById('statusLog');

      try {
        const compiledPayloads = parseSimpleCode(code);
        outputElem.textContent = JSON.stringify(compiledPayloads, null, 2);
        statusElem.textContent = 'Compilation successful. Dispatching requests...';

        if (!authToken) {
          statusElem.textContent = 'Compiled successfully! (Connect Yoto Account to execute live calls)';
          return;
        }

        for (const cmd of compiledPayloads) {
          await fetch('http://localhost:3000/api/launch', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${authToken}`
            },
            body: JSON.stringify({
              deviceId: cmd.endpoint.split('/')[4],
              cardUri: cmd.payload.uri
            })
          });
        }
        statusElem.textContent = 'Execution complete: Commands sent to Yoto player!';
      } catch (err) {
        outputElem.textContent = `Error: ${err.message}`;
        statusElem.textContent = 'Compilation failed.';
      }
    }
  </script>
</body>
</html>
